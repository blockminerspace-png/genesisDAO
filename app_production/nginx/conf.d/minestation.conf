server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name genesisdao.tech www.genesisdao.tech;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $app_upstream http://app:3000;

    ssl_certificate /etc/letsencrypt/live/genesisdao.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genesisdao.tech/privkey.pem;

    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/conf.d/sensitive-deny.inc;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header True-Client-IP $http_true_client_ip;

    location ^~ /ws/ {
        limit_req zone=perip burst=200 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Suporte: multipart com vários anexos (multer até ~60MB); predefinição nginx 1m → 413.
    location ^~ /api/support/ {
        client_max_body_size 70m;
        limit_req zone=perip burst=200 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/admin/support-tickets/ {
        client_max_body_size 70m;
        limit_req zone=perip burst=200 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload admin de imagens (Editor de itens, banners, etc.). Multer back-end aceita 50 MB
    # — damos folga para boundaries multipart. Predefinição nginx 1m → 413 antes do app.
    location = /api/admin/upload-image {
        client_max_body_size 60m;
        limit_req zone=perip burst=50 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/admin/upload-ad {
        client_max_body_size 10m;
        limit_req zone=perip burst=50 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Legado JSON dataUrl (5MB no backend → folga para overhead base64).
    location = /api/upload-image {
        client_max_body_size 10m;
        limit_req zone=perip burst=50 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # P2P mercado: transação com FOR UPDATE (listing + game_states); pode exceder 120s sob pico.
    location ^~ /api/market/ {
        limit_req zone=perip burst=200 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Abrir caixas: transação com FOR UPDATE + possíveis bundles; evitar 504 aos 120s.
    location ^~ /api/lucky-boxes/ {
        limit_req zone=perip burst=200 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emite assets com hash imutável no nome → cache eterno.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker: nunca cachear (browser precisa apanhar a versão nova
    # logo no próximo navegar para correr o `unregister` que limpa caches).
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (`/`, `/index.html`, deep-links da SPA): nunca cachear
    # no edge — Cloudflare/browser ficavam colados ao "template antigo"
    # após deploys porque o `index.html` referencia hashes que mudam.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        limit_req zone=perip burst=200 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

