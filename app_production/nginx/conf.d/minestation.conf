        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (`/`, `/index.html`, deep-links da SPA): nunca cachear
    # no edge — Cloudflare/browser ficavam colados ao "template antigo"
    # após deploys porque o `index.html` referencia hashes que mudam.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        limit_req zone=perip burst=200 nodelay;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
