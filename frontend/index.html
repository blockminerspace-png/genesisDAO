<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genesis Miner — simulador Web3 de mineração | Genesis DAO</title>
  <meta
    name="description"
    content="Genesis Miner: simulador de mineração digital com racks, energia e economia Web3. Entre, monte o seu data center e evolua no ecossistema Genesis DAO."
  />
  <meta name="theme-color" content="#0f0c08" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <meta property="og:title" content="Genesis Miner — Genesis DAO" />
  <meta property="og:description" content="Simulador Web3 de mineração digital: racks, energia, mercado e progressão rumo à Polygon." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="/img/favicon/genesis-miner-logo.png" />
  <link rel="preload" href="/img/favicon/genesis-miner-logo.png" as="image" type="image/png" />
  <script>
    (function () {
      try {
        var meta = document.querySelector('meta[name="gm-build-id"]');
        var stamp = meta && meta.getAttribute('content');
        if (!stamp) return;
        var key = 'gm_html_build_stamp_v1';
        var prev = sessionStorage.getItem(key);
        if (prev && prev !== stamp) {
          sessionStorage.removeItem('gm_chunk_autoreload_v1');
          sessionStorage.removeItem('gm_boundary_recovery_v1');
          sessionStorage.removeItem('gm_app_build_stamp_v1');
        }
        sessionStorage.setItem(key, stamp);
      } catch (e) { /* ignore */ }

      function gmHardReloadEarly() {
        try {
          var u = new URL(window.location.href);
          u.searchParams.set('_v', String(Date.now()));
          window.location.replace(u.pathname + u.search + u.hash);
        } catch (e2) {
          window.location.reload();
        }
      }

      window.addEventListener(
        'error',
        function (event) {
          var target = event.target;
          if (!target || target.tagName !== 'SCRIPT' && target.tagName !== 'LINK') return;
          var src = target.src || target.href || '';
          if (src && /\/assets\//.test(src)) {
            gmHardReloadEarly();
          }
        },
        true
      );
    })();
  </script>
  <style>
    /* Tipografia local (sem fonts.googleapis.com — menos latência e menos terceiros na cadeia crítica) */
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* Animation for the clicking effect */
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0);
      }

      100% {
        opacity: 0;
        transform: translateY(-20px);
      }
    }

    .float-text {
      position: absolute;
      pointer-events: none;
      animation: floatUp 1s ease-out forwards;
    }
  </style>
